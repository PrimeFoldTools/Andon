name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    # Ubuntu 26.04 (ubuntu-latest) has no Python 3.9; keep 3.9 tested on 24.04
    # because macOS still ships 3.9 as /usr/bin/python3.
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]

    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test runner
        run: python -m pip install --upgrade pip pytest

      - name: Compile Python files
        run: python -m compileall -q hooks scripts

      - name: Run tests
        run: python -m pytest hooks/tests/ -q
